# auxi/maestro/flows/capsule/create.yaml
# Capsule Wardrobe — create-a-capsule happy path (spec §5 create wizard).
#
# testID-driven end-to-end: Wardrobe → wardrobe switcher → Create Capsule →
# create wizard (name → build method) → empty capsule detail. Assumes a
# logged-in session (run ../_shared/login.yaml first) with a backend that
# serves /api/capsules. The sidebar/capsule-list entry was removed — the
# wardrobe switcher is now the sole entry point to capsule creation.
#
# "Build it myself" is the only buildable path today: it POSTs a name-only
# capsule and lands on the (empty) detail screen. "Let AI build it" carries a
# Coming-soon tag and cannot be selected.
#
# NOTE: authored best-effort; not run headless in this session (no sim).
#
# Run: maestro test maestro/flows/capsule/create.yaml

appId: com.auxi2026.app
name: capsule-create
tags:
  - capsule
  - regression
env:
  CREATE_TIMEOUT_MS: 30000
---
# 0. Start logged-in on Home.
- runFlow: ../_shared/login.yaml

# 1. From Home, hop to the Wardrobe tab (its header hosts the switcher).
- tapOn:
    id: home-footer-nav-wardrobe
- extendedWaitUntil:
    visible:
      id: wardrobe-switcher-title
    timeout: 10000

# 2. Open the wardrobe switcher, then tap "Create Capsule".
- tapOn:
    id: wardrobe-switcher-title
- extendedWaitUntil:
    visible:
      id: wardrobe-switcher-sheet
    timeout: 10000
- tapOn:
    id: wardrobe-switcher-create

# 3. Step 1 — name.
- extendedWaitUntil:
    visible:
      id: capsule-create-name-input
    timeout: 10000
- tapOn:
    id: capsule-create-name-input
- inputText: 'Work week'
- tapOn:
    id: capsule-create-continue

# 4. Step 2 — build method. "Build it myself" is preselected; the AI option is
#    present but tagged Coming soon (assert the tag, and that tapping it does
#    NOT move the selection).
- extendedWaitUntil:
    visible:
      id: capsule-method-manual-selected
    timeout: 10000
- assertVisible:
    id: capsule-method-ai-badge
- tapOn:
    id: capsule-method-ai
- assertVisible:
    id: capsule-method-manual-selected

# 4b. Rename inline via the pencil, then commit with the tick.
- tapOn:
    id: capsule-method-name-edit
- tapOn:
    id: capsule-method-name-input
- inputText: ' capsule'
- tapOn:
    id: capsule-method-name-edit-done

- tapOn:
    id: capsule-method-next

# 5. The empty capsule detail — nothing in it yet, add (+) is the next step.
- extendedWaitUntil:
    visible:
      id: capsule-detail-add
    timeout: ${CREATE_TIMEOUT_MS}
- assertVisible:
    id: capsule-detail-empty
- assertVisible:
    id: capsule-detail-edit
- assertVisible:
    id: capsule-detail-delete
